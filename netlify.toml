[build]
  base = ""
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Content Security Policy
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.youtube.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: http:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.supabase.co; frame-src 'self' https://www.youtube.com; media-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"

# Cache-Control pour les fichiers statiques
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirections SEO
[[redirects]]
  from = "/cours/licence-1"
  to = "/L1"
  status = 301
  force = true

[[redirects]]
  from = "/cours/licence-2"
  to = "/L2"
  status = 301
  force = true

[[redirects]]
  from = "/cours/licence-3"
  to = "/L3"
  status = 301
  force = true

[[redirects]]
  from = "/communaute"
  to = "/forum"
  status = 301
  force = true

# Redirection HTTP vers HTTPS
[[redirects]]
  from = "http://ida-cours.netlify.app/*"
  to = "https://ida-cours.netlify.app/:splat"
  status = 301
  force = true

# Redirection www vers non-www
[[redirects]]
  from = "https://www.ida-cours.netlify.app/*"
  to = "https://ida-cours.netlify.app/:splat"
  status = 301
  force = true

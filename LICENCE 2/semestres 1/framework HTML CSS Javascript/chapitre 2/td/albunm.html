<!DOCTYPE html>
<html lang="en">
<head>
  <title>Album.html</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.0/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/js/bootstrap.min.js"></script>
  <!-- Security Headers -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <meta name="format-detection" content="telephone=no" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: *.google.com *.googleapis.com *.gstatic.com *.youtube.com *.doubleclick.net; img-src 'self' https: data:; font-src 'self' https: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: *.google.com *.googleapis.com *.gstatic.com *.youtube.com *.doubleclick.net; style-src 'self' 'unsafe-inline' https: *.googleapis.com; frame-src 'self' https: *.youtube.com;" />

</head>
<style>

  img{
    width: 30%;
    margin-left: 455px;
  }

  h2{
    text-align: center;
    margin-top: 50px;
  }

 #myCarousel {
    margin-top: 75px;
  }

</style>
<body>

<div class="container-fluid">
  <h2>Mes sites de choix pour des vaccances de reves</h2>
  <div id="myCarousel" class="carousel slide" data-ride="carousel">
    <!-- Indicators -->
    <ol class="carousel-indicators">
      <li data-target="#myCarousel" data-slide-to="0" class="active"></li>
      <li data-target="#myCarousel" data-slide-to="1"></li>
      <li data-target="#myCarousel" data-slide-to="2"></li>
      <li data-target="#myCarousel" data-slide-to="3"></li>
    </ol>

    <!-- Wrapper for slides -->
    <div class="carousel-inner">

      <div class="item active">
        <img src="image/gorée.jpg" alt="Coumba Castel de gorée">
        <div class="carousel-caption">
          <h3>The house of slaves from Sénégal</h3>
          <p>Gorée is always so much fun!</p>
        </div>
      </div>

      <div class="item">
        <img src="image/burj-al-arab.jpg" alt="Dubai">
        <div class="carousel-caption">
          <h3>burj-al-arab</h3>
          <p>Amazing and ingenius building in Dubai !</p>
        </div>
      </div>
    
      <div class="item">
        <img src="image/hawai.jpg" alt="New York">
        <div class="carousel-caption">
          <h3>Hawai</h3>
          <p>We love a beautiful sunset to Hawai!</p>
        </div>
      </div>

       <div class="item">
        <img src="image/senegal.jpg" alt="New York">
        <div class="carousel-caption">
          <h3>Dakar</h3>
          <p>Country of Téranga</p>
        </div>
      </div>
  
    </div>

    <!-- Left and right controls -->
    <a class="left carousel-control" href="#myCarousel" data-slide="prev">
      <span class="glyphicon glyphicon-chevron-left"></span>
      <span class="sr-only">Previous</span>
    </a>
    <a class="right carousel-control" href="#myCarousel" data-slide="next">
      <span class="glyphicon glyphicon-chevron-right"></span>
      <span class="sr-only">Next</span>
    </a>
  </div>
</div>


<script>
document.addEventListener('DOMContentLoaded', function() {
    // Bloquer le clic droit
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        return false;
    });

    // Bloquer la sélection de texte
    document.addEventListener('selectstart', function(e) {
        e.preventDefault();
        return false;
    });

    // Bloquer copier/coller/couper
    ['copy', 'cut', 'paste'].forEach(function(evt) {
        document.addEventListener(evt, function(e) {
            e.preventDefault();
            return false;
        });
    });

    // Bloquer raccourcis DevTools et code source
    document.addEventListener('keydown', function(e) {
        // F12
        if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            return false;
        }
        // Ctrl+Shift+I / Cmd+Opt+I
        if ((e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'i') ||
            (e.metaKey && e.altKey && e.key.toLowerCase() === 'i')) {
            e.preventDefault();
            return false;
        }
        // Ctrl+Shift+J / Cmd+Opt+J
        if ((e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'j') ||
            (e.metaKey && e.altKey && e.key.toLowerCase() === 'j')) {
            e.preventDefault();
            return false;
        }
        // Ctrl+Shift+C / Cmd+Opt+C
        if ((e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'c') ||
            (e.metaKey && e.altKey && e.key.toLowerCase() === 'c')) {
            e.preventDefault();
            return false;
        }
        // Ctrl+U / Cmd+U
        if ((e.ctrlKey && e.key.toLowerCase() === 'u') ||
            (e.metaKey && e.key.toLowerCase() === 'u')) {
            e.preventDefault();
            return false;
        }
        // Ctrl+S / Cmd+S
        if ((e.ctrlKey && e.key.toLowerCase() === 's') ||
            (e.metaKey && e.key.toLowerCase() === 's')) {
            e.preventDefault();
            return false;
        }
        // Ctrl+P / Cmd+P
        if ((e.ctrlKey && e.key.toLowerCase() === 'p') ||
            (e.metaKey && e.key.toLowerCase() === 'p')) {
            e.preventDefault();
            return false;
        }
        // Ctrl+F / Cmd+F
        if ((e.ctrlKey && e.key.toLowerCase() === 'f') ||
            (e.metaKey && e.key.toLowerCase() === 'f')) {
            e.preventDefault();
            return false;
        }
    });

    // Détection DevTools par resize
    setInterval(function() {
        if (window.outerWidth - window.innerWidth > 160 ||
            window.outerHeight - window.innerHeight > 160) {
            document.body.innerHTML = '<h1 style="color:red;text-align:center;margin-top:20vh;">Accès restreint : DevTools détecté !</h1>';
        }
    }, 1000);

    // Désactiver le drag and drop des images
    document.addEventListener('dragstart', function(e) {
        if (e.target.tagName === 'IMG') {
            e.preventDefault();
            return false;
        }
    });

    // Empêcher l'ouverture d'images dans un nouvel onglet
    document.addEventListener('click', function(e) {
        if (e.target.tagName === 'IMG' && e.button === 0) {
            e.preventDefault();
            return false;
        }
    });
});
</script>

</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Document sans nom</title>
</head>

<body>
<!DOCTYPE html>
<html>
<head>
<script src="jquery/jquery-3.3.1.min.js"></script>
<script>
$(document).ready(function(){
	$("button").click(
		function(){ 
			$("p").toggle("slow"); 
		});
});
</script>
</head>
<body>
<p>Contenu du paragraphe 1.</p>
<p>Contenu du paragraphe 2</p>
<p>Contenu du paragraphe 3</p>
<button>Cliquez pour cachez ou montrer</button>
</body>
</html>
</body>
</html>

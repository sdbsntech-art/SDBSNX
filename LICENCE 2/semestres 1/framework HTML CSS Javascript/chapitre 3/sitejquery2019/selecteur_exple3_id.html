<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Document sans nom</title>
</head>

<body>
<!DOCTYPE html>
<html>
<head>
<script src="jquery/jquery-3.3.1.min.js"></script>
<script>
$(document).ready(function(){
	$("button").click(
		function(){ 
			$("#pg2").hide(); 
		}
	);
});
</script>
</head>
<body>
<p>Cliquez sur moi et je disparais.</p>
<p id="pg2">Cliquez sur moi!</p>
<p>Cliquez sur moi aussi!</p>
<button>Cliquez</button>
</body>
</html>
</body>
</html>

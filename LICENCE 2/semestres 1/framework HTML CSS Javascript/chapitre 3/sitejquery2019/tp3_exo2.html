<!doctype html>
<html>
<head>
<meta charset="utf-8">

<script src="jquery/jquery-3.3.1.min.js"></script>
<script>
$(document).ready(function(){
	$("#btn").click(function(){
      $("p").hide();
	}); 
	
	$("#btn1").click(function(){
		$("p").show();
	}); 
	
	$("#btn2").click(function(){
		$("#p2").hide();
	}); 

   $("#btn3").click(function(){
		$(".cl1").hide();
	}); 

});
</script>
</head>
<body>


<p class="cl1"> paragraph1 </p>
<p id="p2"> paragraph2 </p>
<p class="cl1"> paragraph3 </p>
<p> paragraph4 </p>
<p> paragraph5 </p>
<button id="btn">Cacher les paragraphes.</button>
<br><br>
<button id="btn1">Montre les paragraphes.</button> 
<br><br>
<button id="btn2">Cacher le paragraphes id:p2.</button> 
<br><br>
<button id="btn3">Cacher le paragraphes classe:cl1.</button> 






</body>
</html>

<!doctype html>
<html>
<head>
<style>
#div1{
	position:relative;
	width:50px;
	height:50px;
	background-color:blue}
</style>
<script src="jquery/jquery-3.3.1.min.js"></script>
<script>
$(document).ready(function(){
	$("button").click(function(){
		$("#div1").animate({
			height:'toggle',
			width:'toggle'
		});
	});
});
</script>
</head>
<body>
<button>SlideToggle</button><br><br>
<div id="div1">Ok
</div>
<br>
</body>
</html>

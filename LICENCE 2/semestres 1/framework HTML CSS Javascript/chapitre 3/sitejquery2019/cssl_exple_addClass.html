<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
.jaune{
	position:relative;
	width:200px;
	height:200px;
	background-color:yellow;
}
#div1{

	width:200px;
	height:200px;
	background-color:yellow;
	border-radius: 100px;
}
</style>
<script src="jquery/jquery-3.3.1.min.js"></script>
<script>
$(document).ready(function(){
	$("#btn").click(function(){
		$("div").addClass("jaune");
	}); 

});
</script>
</head>
<body>
<button id="btn">Tester</button> 

<div id="div1">Contenu du div</div>
<br>
</body>
</html>

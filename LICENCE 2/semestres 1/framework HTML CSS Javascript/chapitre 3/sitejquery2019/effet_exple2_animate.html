<!doctype html>
<html>
<head>
<style>
#img{
	position:relative;
	}
</style>
<script src="jquery/jquery-3.3.1.min.js"></script>
<script>
$(document).ready(
	function(){
		$("#btnplus").click(function(){
			$("#img").animate({
				height:'+=10px',
				width:'+=10px'
			});
		});
		$("#btnmoins").click(function(){
			$("#img").animate({
				height:'-=10px',
				width:'-=10px'
			});
	});
});
</script>
</head>
<body>
<p style="text-align:center">
<button id="btnplus">+</button> <button id="btnmoins">-</button><br<br><br>
<br>
<img id="img" src="images/fleur.gif" width="200">
</p>
</body>
</html>

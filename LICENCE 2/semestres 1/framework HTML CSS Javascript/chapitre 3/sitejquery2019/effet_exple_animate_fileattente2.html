<!doctype html>
<html>
<head>
<style>
#div1{
	position:relative;
	width:50px;
	height:50px;
	background-color:yellow;
}
</style>
<script src="jquery/jquery-3.3.1.min.js"></script>
<script>
$(document).ready(function(){
	$("button").click(function(){
		var div = $("#div1");
		div.animate({left: '100px'}, "slow");
		div.animate({fontSize: '3em'}, "slow");
	}); 
	
});
</script>
</head>
<body>
<button>SlideToggle</button><br><br>

<div id="div1">Contenu du div</div>
<br>
</body>
</html>

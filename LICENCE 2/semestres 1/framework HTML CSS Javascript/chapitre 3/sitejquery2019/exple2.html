<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Document sans nom</title>
</head>

<body>
<!DOCTYPE html>
<html>
<head>
<script src="jquery/jquery-3.3.1.min.js"></script>
<script>
$(document).ready(function(){//ça permet d'attendre que le tout le doc se charge avec d'executer le code
	$("#btn1").click(//SI on clique sur l'élément d'id = btn, on appel la fonction ci-dessous
		function(){ 
			$("p").hide(); //Elle cache tous les éléments p
		});

	$("#btn2").click(//SI on clique sur l'élément d'id = btn, on appel la fonction ci-dessous
		function(){ 
			$("p").show(); //Elle cache tous les éléments p
		});
});
</script>
</head>
<body>
<p id="p1" class="c1">Le contenu du paragraphe 1.</p>
<div id="p1" class="c1">Le contenu du div .</div>
<p>Le contenu du paragraphe 2.</p>
<button id="btn1">Cachez les p</button><br>
<button id="btn2">Montrer les p</button>
</body>
</html>
</body>
</html>

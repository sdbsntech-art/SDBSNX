<title>Document sans nom</title>
</head>

<body>
<!DOCTYPE html>
<html>
<head>
<script src="jquery/jquery-3.3.1.min.js"></script>
<script>
$(document).ready(function(){
	$("button").click(
		function(){ 
			$(".cl1").hide(); 
		}
	);
});
</script>
</head>
<body>
<p class="cl1">Cliquez sur moi et je disparais.</p>
<p id="pg2">Cliquez sur moi!</p>
<div class="cl1">Cliquez sur moi aussi!</div>
<button>Cliquez</button>
</body>
</html>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="option de cours">
    <meta name="keywords" content="cours, option, pdf, tuto">
    <meta name="author" content="IDA COURS">
    <link rel="stylesheet" href="index.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="favicon.png" sizes="180x180">
    <link rel="icon" href="favicon.png" sizes="32x32" type="image/png">
    <link rel="icon" href="favicon.png" sizes="16x16" type="image/png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<title>option de cours</title>

    <style>
        .pdf-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin: 30px auto;
            max-width: 1200px;
        }

        .module-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }

        .pdf-section h2 {
            font-size: 1.6rem;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: left;
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
            font-weight: 600;
        }

        .module-title {
            font-size: 2rem;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
            font-weight: 700;
        }

        .semester-title {
            font-size: 2.2rem;
            color: #2c3e50;
            text-align: center;
            margin: 40px 0;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .pdf-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }

        .pdf-item {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            border: 1px solid #e9ecef;
        }

        .pdf-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            background: #fff;
            border-color: #3498db;
        }

        .pdf-item i {
            font-size: 1.8rem;
            color: #e74c3c;
            transition: transform 0.3s ease;
        }

        .pdf-item:hover i {
            transform: scale(1.1);
        }

        .pdf-item a {
            text-decoration: none;
            color: #2c3e50;
            font-size: 1rem;
            font-weight: 500;
            transition: color 0.3s ease;
            flex: 1;
        }

        .pdf-item a:hover {
            color: #3498db;
        }

        @media (max-width: 768px) {
            .pdf-section {
                padding: 20px;
                margin: 15px;
            }

            .pdf-list {
                grid-template-columns: 1fr;
            }

            .semester-title {
                font-size: 1.8rem;
            }

            .module-title {
                font-size: 1.6rem;
            }
        }
    </style>



</body>
</html>
